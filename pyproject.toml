[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-investor"
version = "0.1.0"
description = "Research on Bitget Earn as a pump-and-dump predictor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
