name: scrape

on:
  schedule:
    # Hourly. Empirical: fastest observed earn_events status transition = 166 min
    # (median 576 min). Hourly gives >2x safety margin vs fastest, and 1h stamp
    # is 4% of the 24h label horizon (negligible smearing). Private-repo GH cron
    # throttles this schedule further, so an external cron hits workflow_dispatch.
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install --quiet -e .

      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m defi_investor.scraper

      - name: Upload raw capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/**/*.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload catalog snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: data/events/*.jsonl
          retention-days: 7
          if-no-files-found: warn
